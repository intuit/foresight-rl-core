# see https://mypy.readthedocs.io/en/stable/existing_code.html#introduce-stricter-options
[mypy]
exclude = (?x)(
    ^intuit/examples/legacy/
    | ^estimates/
    | ^intuit/
  )
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True

strict_equality = True
extra_checks = True

check_untyped_defs = True

# Optional dependencies (not installed in lint/CI environments)
[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-sagemaker.*]
ignore_missing_imports = True

[mypy-trl.*]
ignore_missing_imports = True

[mypy-peft.*]
ignore_missing_imports = True

[mypy-vllm.*]
ignore_missing_imports = True

[mypy-verl.*]
ignore_missing_imports = True

[mypy-hydra.*]
ignore_missing_imports = True

[mypy-langchain_openai.*]
ignore_missing_imports = True

[mypy-idps_sdk.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-datasets.*]
ignore_missing_imports = True

[mypy-math_verify.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

# Container-side scripts run in SageMaker, not as part of the installed package
[mypy-foresightrlcore.runtime.scripts.*]
ignore_errors = True

# Advice task implementation runs against heavy ML deps inside the SageMaker
# container. Lint environment does not install transformers/datasets/trl, so
# downstream type inference (e.g. dataset row types) cannot be checked here.
[mypy-foresightrl_intuit.*]
ignore_missing_imports = True

[mypy-foresightrlcore.tasks.email_outcome]
ignore_errors = True
