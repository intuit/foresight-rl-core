plugins {
    id "java"
    id "io.gatling.gradle" version "3.11.5.2"
}

repositories {
    mavenCentral()

    maven {
        url = uri("https://repo1.maven.org/maven2/")
    }
}

ext {
    lombokVersion = '1.18.34'
    jacksonVersion = "2.15.0"
    apacheCommonsVersions = "3.14.0"
    apacheCommonIOVersion = "2.16.1"
    csvCommonsVersion = "1.13.0"
    slf4JVersion = "2.0.16"
    okHttpVersion = "4.12.0"
    guavaVerion = "32.1.3-jre"
}


gatling {
    gatlingVersion = '3.11.5'
    systemProperties = ['file.encoding': 'UTF-8']
}

sourceSets {
    gatling {
        java {
            exclude '**/.ipynb_checkpoints/**'
        }
        resources {
            exclude '**/.ipynb_checkpoints/**'
        }
    }
}

allprojects {
    java {
        sourceCompatibility = 17
        targetCompatibility = 17
    }
}

dependencies {
    gatlingImplementation("com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}")
    gatlingImplementation("com.fasterxml.jackson.core:jackson-core:${jacksonVersion}")
    gatlingImplementation("org.apache.commons:commons-lang3:${apacheCommonsVersions}")
    gatlingImplementation("commons-io:commons-io:${apacheCommonIOVersion}")
    gatlingImplementation("org.slf4j:slf4j-api:${slf4JVersion}")
    gatlingImplementation("org.slf4j:slf4j-simple:${slf4JVersion}")
    gatlingImplementation("com.google.guava:guava:${guavaVerion}")
    gatlingImplementation("com.squareup.okhttp3:okhttp:${okHttpVersion}")
    gatlingImplementation("org.apache.commons:commons-csv:${csvCommonsVersion}")

    gatling "org.projectlombok:lombok:$lombokVersion"
    gatlingAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
}
