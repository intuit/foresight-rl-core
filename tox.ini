[tox]
envlist =
    lint,
    oss,
    intuit,
    py311,
    py312,
    py313,

[testenv]
runner = uv-venv-lock-runner
uv_python_preference = only-managed
extras = aws, optimizer, evaluate
dependency_groups = test
passenv = UV_LINK_MODE
setenv =
    APP_ENV = {env:APP_ENV:local}
    COVERAGE_FILE = .coverage_db_{envname}
commands =
    pytest \
      --color=yes \
      --cov=foresightrlcore \
      --cov-report html:htmlcov_{envname} \
      --cov-report term \
      --cov-report xml:coverage_{envname}.xml \
      --cov-fail-under=80

[testenv:oss]
extras = aws, optimizer, evaluate
dependency_groups = test
allowlist_externals = bash
setenv =
    {[testenv]setenv}
    FORESIGHT_OSS_ONLY = 1
# No --ignore list: modules needing the extension guard themselves with
# `pytest.importorskip("foresightrl_intuit")` and individual tests carry
# `@pytest.mark.requires_intuit`, so they skip on availability. A hand-kept
# ignore list would drift the moment a test file is added or renamed, and it
# only protected this env -- an OSS checkout with `intuit/` deleted still
# crashed at collection.
commands =
    bash scripts/check_intuit_fingerprints.sh
    pytest \
      --color=yes \
      -o pythonpath=. \
      --cov=foresightrlcore \
      --cov-report term \
      --cov-fail-under=80 \
      tests/

[testenv:intuit]
extras = aws, optimizer, evaluate
dependency_groups = test
commands_pre =
    uv pip install -e intuit/
commands =
    pytest \
      --color=yes \
      --cov=foresightrlcore \
      --cov=foresightrl_intuit \
      --cov-report term \
      --cov-fail-under=80 \
      tests/ intuit/tests

[testenv:lint]
extras = aws
dependency_groups = dev, test
commands =
    isort --version
    isort --check-only --df .
    black --version
    black --check --diff .
    mypy --version
    mypy .

[testenv:py311]
[testenv:py312]
[testenv:py313]
